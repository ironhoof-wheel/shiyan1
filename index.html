<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" 
content="width=device-width, initial-scale=1.0">

<title>IronHoof Wheels</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="site-header">

<div class="container nav-container">

<div class="logo">
IRONHOOF
</div>


<nav id="main-nav">

<a href="#home">Home</a>

<a href="#products">Products</a>

<a href="#about">About</a>

<a href="#contact">Contact</a>

</nav>


<button 
id="menu-toggle"
class="menu-toggle">

☰

</button>


</div>

</header>




<!-- ================= HOME ================= -->

<section 
id="home"
class="hero">


<div class="container hero-content">


<h1>
FORGED FOR<br>
PERFORMANCE
</h1>


<p>
Premium forged wheels engineered 
for strength and style.
</p>


<a href="#products"
class="btn">

Explore Wheels

</a>


</div>


</section>





<!-- ================= PRODUCTS ================= -->

<section 
id="products"
class="products-section">


<div class="container">


<h2>
Our Collection
</h2>


<div 
id="category-filter"
class="filters">


<button data-filter="all">
All
</button>


<button data-filter="forged">
Forged
</button>


<button data-filter="flow-formed">
Flow Formed
</button>


</div>



<div 
id="product-grid"
class="product-grid">


<!-- 商品由 products.js 自动生成 -->


</div>


</div>


</section>





<!-- ================= PRODUCT DETAIL ================= -->


<section
id="product-detail"
class="product-detail-section">


<div 
id="detail-container"
class="container">


<!-- 详情由 JS 插入 -->


</div>


</section>






<!-- ================= ABOUT ================= -->


<section
id="about"
class="about-section">


<div class="container">


<h2>
About IronHoof
</h2>


<p>

IronHoof creates premium performance wheels
designed for enthusiasts.

</p>


</div>


</section>







<!-- ================= CONTACT ================= -->


<section
id="contact"
class="contact-section">


<div class="container">


<h2>
Contact
</h2>



<form 
id="contact-form">


<input 
type="text"
name="name"
placeholder="Your Name">


<input
type="email"
name="email"
placeholder="Email">


<textarea
name="message"
placeholder="Message">
</textarea>


<button type="submit">

Send

</button>


</form>


</div>


</section>








<!-- ================= FOOTER ================= -->


<footer>


<div class="container">


<p>

© IronHoof Wheels

</p>


</div>


</footer>







<!-- ================= JAVASCRIPT ================= -->


<script src="js/products.js"></script>

<script src="js/app.js"></script>


</body>


</html>
